# Push to main → build the site and publish it to Cloudflare (Worker "tahoun", tahoun.wheretospot.com).
# Needs the repository secret CLOUDFLARE_API_TOKEN (Cloudflare → My Profile → API Tokens, template "Edit Cloudflare Workers").
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4f5d12c07701edca8597825d6e4e929a
